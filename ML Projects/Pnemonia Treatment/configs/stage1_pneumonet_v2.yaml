# Stage 1 Detection: PneumoNet-v2 (Normal vs Pneumonia)
# Paper individual accuracy: 96.8%
# Ensemble weight: 3

data:
  image_size: 224
  batch_size: 32
  train_ratio: 0.8
  seed: 42
  num_workers: 0
  grayscale_to_rgb: true
  augment: true

training:
  model: pneumonet_v2
  num_classes: 2
  learning_rate: 0.0001
  momentum: 0.9
  epochs: 15
  use_class_weights: true
  use_weighted_sampler: false

evaluation:
  model: pneumonet_v2
  num_classes: 2