# Stage 1 Detection: Inception-v3 (Normal vs Pneumonia) - Transfer Learning
# Paper ensemble weight: 4 (second highest in Stage 1 ensemble)
# Note: uses native 299x299 internally; we feed 224x224 (resized in forward)

data:
  image_size: 224
  batch_size: 16    # Inception-v3 is heavier
  train_ratio: 0.8
  seed: 42
  num_workers: 0
  grayscale_to_rgb: true
  augment: true

training:
  model: inception_v3
  num_classes: 2
  learning_rate: 0.0001
  momentum: 0.9
  epochs: 15
  use_class_weights: true
  use_weighted_sampler: false

evaluation:
  model: inception_v3
  num_classes: 2