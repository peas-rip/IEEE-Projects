# Stage 2: MobileNet-v2 for Bacterial vs Viral classification

data:
  image_size: 224
  batch_size: 32
  train_ratio: 0.8
  seed: 42
  num_workers: 0
  grayscale_to_rgb: true
  augment: true

training:
  model: mobilenet_v2
  num_classes: 2
  learning_rate: 0.0001
  momentum: 0.9
  epochs: 10

evaluation:
  model: mobilenet_v2
  num_classes: 2
