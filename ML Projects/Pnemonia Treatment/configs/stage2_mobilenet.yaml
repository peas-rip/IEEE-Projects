# Stage 2 Classification: MobileNet-v2 (Bacterial vs Viral)
# Paper: Transfer learning baseline for classification stage

data:
  image_size: 224
  batch_size: 16
  train_ratio: 0.8
  seed: 42
  num_workers: 2
  grayscale_to_rgb: true
  augment: true

training:
  model: mobilenet_v2
  num_classes: 2
  learning_rate: 0.0001
  momentum: 0.9
  epochs: 15
  use_class_weights: true
  use_weighted_sampler: false

evaluation:
  model: mobilenet_v2
  num_classes: 2