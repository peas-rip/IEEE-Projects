# Stage 2 Classification: Xception (Bacterial vs Viral)
# Paper: Transfer learning baseline for classification stage
# Note: Xception not in torchvision; using Inception-v3 as substitute (INFERRED)

data:
  image_size: 224
  batch_size: 16
  train_ratio: 0.8
  seed: 42
  num_workers: 4
  grayscale_to_rgb: true
  augment: true

training:
  model: inception_v3
  num_classes: 2
  learning_rate: 0.0001
  momentum: 0.9
  epochs: 15
  use_class_weights: true
  use_weighted_sampler: false

evaluation:
  model: inception_v3
  num_classes: 2